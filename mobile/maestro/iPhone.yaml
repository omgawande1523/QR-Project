# iOS cloud check (mobile/scripts/ios-ci.sh): the owner signs in on an iPhone simulator against the test API
# (server/scripts/test-api.js, demo data) and opens the orders board, which stays upright when turned. Screenshots land where Maestro runs.
appId: com.qrmenu.staff
name: Owner on iPhone
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn: "Email or phone"
- inputText: "demo@qrmenu.test"
- tapOn: "Password"
- inputText: "Demo@1234"
- tapOn: "Log in"
- extendedWaitUntil:
    visible: "Olive Leaf Café"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: iPhone-2-dashboard
- tapOn: "Open orders board"
- extendedWaitUntil:
    visible: "Board"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: iPhone-3-orders
# Turned sideways, the orders board stays in portrait (only the kitchen display rotates on iPhone).
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- takeScreenshot: iPhone-4-turned-sideways
- setOrientation: PORTRAIT
